<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Talking Workout Trainer – Free Interval Timer with Voice Announcements</title>
		<meta name="description" content="Free interval workout timer that announces every exercise out loud. Build custom workouts with your own work and rest times, shuffle them and share via link. No account, works offline on any phone or desktop." />
		<link rel="canonical" href="https://flappix.github.io/talking-workout-trainer/" />
		<meta property="og:title" content="Talking Workout Trainer – Interval Timer with Voice Announcements" />
		<meta property="og:description" content="Custom interval workouts that tell you the next exercise out loud. Free, no account, works offline." />
		<meta property="og:site_name" content="Talking Workout Trainer" />
		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://flappix.github.io/talking-workout-trainer/" />
		<meta property="og:image" content="https://flappix.github.io/talking-workout-trainer/screenshot.png" />
		<meta name="twitter:card" content="summary_large_image" />
		<script type="application/ld+json">
		{
			"@context": "https://schema.org",
			"@type": "WebApplication",
			"name": "Talking Workout Trainer",
			"url": "https://flappix.github.io/talking-workout-trainer/",
			"description": "Interval workout timer with voice announcements. No account, no backend, works offline.",
			"applicationCategory": "HealthApplication",
			"operatingSystem": "Any",
			"image": "https://flappix.github.io/talking-workout-trainer/screenshot.png",
			"offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
		}
		</script>

		<!-- progressive web app: installable (add to home screen) and offline -->
		<link rel="manifest" href="manifest.json" />
		<link rel="icon" href="resources/icon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="resources/icon-180.png" />
		<meta name="theme-color" content="#F2F2F5" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Workout" />
		<script>
			// service workers only run over https or on localhost
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register ('sw.js').catch ( error => console.warn ('service worker not registered', error) );
			}
		</script>

		<script src="lib/lodash.min.js"></script>
		<script defer src="lib/alpine.min.js"></script>
		<script src="lib/Speakit1.0.1.min.js"></script>
		<script src="lib/NoSleep.min.js"></script>
		<script src="lib/ajv7.min.js"></script>

		<script src="demo_workouts.js"></script>
		<script src="backup_schema.js"></script>
		<script src="app.js"></script>
		<style>
			body {
				font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
				font-size: 2rem;
				height: 100vh;
				margin: 0;
				padding: 1rem;
				box-sizing: border-box;
			}

			table {
				width: 100%;
				font-size: 4rem;
				border-spacing: 0 1rem;
			}

			table td:first-child {
				border-radius: 1rem 0 0 1rem;
			}

			table td:last-child {
				border-radius: 0 1rem 1rem 0;
			}

			box {
				display: block;
				border-radius: 1.5rem;
				padding: 1rem;
			}
			
			navigation {
				display: flex;
				height: 20%;
			}
			
			backup_panel {
				display: block;
				margin-top: 2rem;
				padding-top: 1rem;
				border-top: 1px solid #A0A0A0;
			}

			error_message {
				display: block;
				margin: 0.5rem 0 1rem 0;
				padding: 1rem;
				border-left: 0.5rem solid #D70015;
			}

			navigation button  {
				flex: 1;
			}
			
			run_panel {
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: space-between;
				height: 70%;
				padding: 1rem;
			}
			
			button {
				cursor: pointer;
				border: none;
				font-weight: 600;
				transition: transform 0.1s, opacity 0.2s;
			}

			button:active:not(:disabled) {
				transform: scale(0.96);
			}

			button:disabled {
				opacity: 0.4;
				cursor: default;
			}

			button, label, input {
				border-radius: 1rem;
				margin: 0.5rem;
				padding: 1rem;
				font-size: 4rem;
				font-family: inherit;
			}

			input {
				border: 1px solid;
			}
			
			select {
				font-size: 2rem;
			}
			
			input[type=text] {
				width: 50vw;
			}
			
			input[type=radio] {
				width: 3rem;
				height: 3rem;
			}
			
			input[type=number] {
				width: 20vw;
			}
			
			label {
				display: flex;
				align-items: center;
				justify-content: space-between;
				border-radius: 1rem;
				padding: 0.5rem 1rem;
			}
			
			/* progress rings (svg), sized by the smaller screen side */
			workout_timer {
				display: block;
				width: min(70vw, 40vh);
				height: min(70vw, 40vh);
			}

			workout_timer svg {
				width: 100%;
				height: 100%;
			}

			workout_timer circle {
				fill: none;
			}
			
			value {
				background-color: #AFAFAF;
				border-radius: 999px;
				font-size: 3rem;
				padding: 0.25rem 1rem;
				font-family: Monospace;
			}
			
			h1, h2, h3 {
				text-align: center;
				margin: 0;
				padding: 0;
			}
			
			h2 {
				font-size: 5rem;
			}
			
			h3 {
				font-size: 4rem;
			}
		</style>
	</head>

	<body x-data="App()">
		<template x-if="!energy_saving_mode">
			<style>
				body {
					background-color: #F2F2F5;
					color: #1C1C1E;
				}

				box {
					background-color: white;
					box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
				}

				.ring_track {
					stroke: #E5E5EA;
				}

				.ring_workout {
					stroke: #8E8E93;
				}

				.ring_exercise {
					stroke: #1C1C1E;
				}

				table tr td {
					background-color: #F2F2F5;
				}

				table tr:active td {
					background-color: #E5E5EA;
				}

				value {
					background-color: #1C1C1E;
					color: white;
				}

				button {
					background-color: #E5E5EA;
					color: #1C1C1E;
					border: 2px solid #C7C7CC;
				}

				input {
					background-color: white;
					border-color: #C7C7CC;
				}

				label {
					border: 1px solid #D1D1D6;
				}

				error_message {
					background-color: #FFECEC;
					color: #8A1C12;
				}
			</style>
		</template>
		
		<template x-if="energy_saving_mode">
			<style>
				body {
					background-color: black;
					color: #ADADAD;
				}
				
				box {
					background-color: black;
					border: 1px solid #333333;
				}

				value {
					background-color: #1C1C1E;
				}

				.ring_track {
					stroke: #1C1C1E;
				}

				.ring_workout {
					stroke: #48484A;
				}

				.ring_exercise {
					stroke: #D2D2D2;
				}

				table tr td {
					background-color: black;
					border-top: 1px solid #333333;
					border-bottom: 1px solid #333333;
				}

				button {
					background-color: #2C2C2E;
					color: #D2D2D2;
					border: 2px solid #48484A;
				}

				input {
					background-color: #1C1C1E;
					color: #D2D2D2;
					border-color: #333333;
				}

				label {
					border: 1px solid #333333;
				}

				error_message {
					background-color: #2A0F0D;
					color: #FF9F96;
				}
			</style>
		</template>
		
		<template x-if="state != 'not_init'">
			<div>
				<template x-if="voices.length == 0">
					<error_message>
						Speech output is not supported in this browser. Workouts will run without voice announcements.
					</error_message>
				</template>
				<template x-if="panel == 'run' && ['not_started', 'finished'].includes (state)">
					<navigation>
						<button @click="stop_workout(); panel = 'create'; curr_workout = null;" x-show="panel != 'create'">+ workout</button>
						<button @click="stop_workout(); temp_workout = _.cloneDeep ( get_curr_workout() ); edit_workout = curr_workout; panel = 'edit';" x-show="panel != 'edit'">Edit workout</button>
						<button @click="stop_workout(); panel = 'load';" x-show="panel != 'load'">Load workout</button>
						<label>
							&#128267;
							<input type="checkbox" :checked="energy_saving_mode" @click="toggleEnergySavingMode()" />
						</label>
					</navigation>
				</template>
				<template x-if="panel == 'load'">
					<box>
						<h3>Load workout</h3>
						<table x-data="{mousedown: null}" style="width: 100%;">
							<template x-for="(workout, w) in workouts" :key="w">
								<tr :style="{'background-color': mousedown == w ? '#A0A0A0' : 'none'}">
									<td style="padding: 0.5rem; cursor: pointer;"
										x-text="workout.name"
										@mousedown="mousedown = w;"
										@mouseup="mousedown = null;"
										@click="load_workout (w)">
									</td>
									<!-- flex on an inner div: display: flex on the td itself stops it from stretching to the row height -->
									<td>
										<div style="display: flex; flex-direction: column; align-items: start; justify-content: center;">
											<div style="margin: 0; padding: 0; white-space: nowrap; margin: 1rem;">
												<value x-html="workout.exercises.length"></value> exercises
											</div>

											<div style="white-space: nowrap; margin: 1rem;">
												<value x-html="secondsToTime ( Math.floor ( getWorkoutDuration (workout) / 1000 ) )"></value>
												minutes
											</div>

											<div style="white-space: nowrap; margin: 1rem;">
												<value><span x-text="workout.completed ?? 0"></span>x</value>
												completed
											</div>
										</div>
									</td>
									
									<td x-data="{shared: false}">
										<div style="display: flex; flex-wrap: wrap;">
											<button title="delete workout" @click="delete_workout (w)" :disabled="workouts.length < 2">&#128465;</button>

											<button title="duplicate workout" @click="duplicate_workout (w)">&#x2398;</button>
											
											<div>
												<button x-show="!shared" @click="shared = true;"><img src="resources/share-fill.svg" width="50" /></button>
												<button x-show="shared" @click="navigator.clipboard.writeText ($refs.share_link.value)">Copy link</button>
												<input x-ref="share_link" style="width: 20vw;" type="text" x-show="shared" :value="window.location.href.split('?')[0] + '?share_workout=' + encodeURIComponent ( JSON.stringify ( _.omit (workout, ['completed']) ) )">
											</div>
										</div>
									</td>
								</tr>
							</template>
						</table>

						<backup_panel>
							<h3>Backup</h3>
							<div style="display: flex; flex-wrap: wrap; justify-content: center;">
								<button title="download all workouts as JSON file" @click="download_backup()">&#11015; Download</button>
								<button title="restore workouts from JSON file" @click="$refs.backup_file.click()">&#11014; Restore</button>
								<input x-ref="backup_file" type="file" accept=".json,application/json" style="display: none;" @change="restore_backup ($event)" />
							</div>
						</backup_panel>
					</box>
				</template>
				<template x-if="panel == 'create' || panel == 'edit'">
					<div>
						<box>
							<label>
								Workout name
								<input type="text" x-model="temp_workout.name" />
							</label>
							
							<label>
								Work period
								<input type="number" x-model="temp_workout.settings.work_period" />
								sec
							</label>
							
							<label>
								<span :style="{'text-decoration': temp_workout.settings.rest_period == 0 ? 'line-through' : 'none'}">Rest period</span>
								<input type="number" x-model="temp_workout.settings.rest_period" />
								sec
							</label>
							
							<div x-data="{show: false}">
								<button @click="show = !show"><span x-html="show ? 'Hide' : 'Show'"></span> advanced settings</button>
								<div x-show="show">
									<label>
										<span :style="{'text-decoration': temp_workout.settings.count_down == 0 ? 'line-through' : 'none'}">Countdown</span>
										<input type="number" x-model="temp_workout.settings.count_down" />
										sec
									</label>
									<label>
										<span :style="{'text-decoration': temp_workout.settings.count_down == 0 ? 'line-through' : 'none'}">Pre-delay</span>
										<input type="number" x-model="temp_workout.settings.pre_delay" />
										sec
									</label>
									<label>
										Speaker
										<select x-model="temp_workout.settings.voice">
											<template x-for="(voice, v) in voices" :key="v">
												<option :value="voice.name" x-text="`${voice.name} (${voice.lang})`" :selected="get_voice (temp_workout.settings.voice) == v"></option>
											</template>
										</select>
									</label>
								</div>
							</div>
						</box>
						
						<h3 style="margin-top: 4rem;">
							Exercises (<span x-html="temp_workout.exercises.length"></span>)
						</h3>
						<template x-if="temp_workout.exercises.length == 0">
							<i>No exercises so far. Press "+ exercise" to add one</i>
						</template>
						<template x-for="(exercise, e) in temp_workout.exercises" :key="e">
							<box style="margin: 0.5rem 0 2rem 0;" :id="`exercise_${e}`">
								<div style="display: flex; justify-content: end;">
									<button @click="if (e > 0) {[temp_workout.exercises[e - 1], temp_workout.exercises[e]] = [temp_workout.exercises[e], temp_workout.exercises[e - 1]]; }"
											:disabled="e <= 0"
											title="move exercise up">&#8593;</button>
									<button @click="if (e < temp_workout.exercises.length - 1) { [temp_workout.exercises[e + 1], temp_workout.exercises[e]] = [temp_workout.exercises[e], temp_workout.exercises[e + 1]]; }"
											:disabled="e >= temp_workout.exercises.length - 1"
											title="move exercise down">&#8595;</button>
									<button @click="temp_workout.exercises.splice (e, 0, _.cloneDeep (exercise) ); setTimeout ( () => document.getElementById (`exercise_${e + 1}`).scrollIntoView ({behavior: 'smooth'}), 200 );"
										title="duplicate exercise">&#x2398;</button>
									<button @click="temp_workout.exercises.splice (e, 1)"
											title="delete exercise">&#128465;</button>
								</div>
								<label>
									Exercise name
									<input type="text" x-model="exercise.name" :id="`exercise_name_${e}`" />
								</label>
								
								<div x-data="{show: false}">
									<button @click="show = !show"><span x-html="show ? 'Hide' : 'Show'"></span> settings</button>
									<button @click="readText (exercise.name, temp_workout)">&#9654; Play</button>
									<div x-show="show">
										<div>
											<label style="justify-content: start;">
												<input type="radio" @click="exercise.work_period = 'default'" :checked="exercise.work_period == 'default'" />
												Use default work period
											</label>
											<label style="justify-content: start;">
												<input type="radio" @click="exercise.work_period = temp_workout.settings.work_period;" :checked="exercise.work_period != 'default'" />
												Use custom work period
												
												<template x-if="exercise.work_period != 'default'">
													<div>
														<input type="number" x-model="exercise.work_period" />
														sec
													</div>
												</template>
											</label>
										</div>
										
										<div>
											<label style="justify-content: start;">
												<input type="radio" @click="exercise.rest_period = 'default'" :checked="exercise.rest_period == 'default'" />
												Use default rest period
											</label>
											<label style="justify-content: start;">
												<input type="radio" @click="exercise.rest_period = temp_workout.settings.rest_period;" :checked="exercise.rest_period != 'default'" />
												Use custom rest period
												
												<template x-if="exercise.rest_period != 'default'">
													<div>
														<input type="number" x-model="exercise.rest_period" />
														sec
													</div>
												</template>
											</label>
										</div>
									</div>
								</div>
							</box>
						</template>
						<div style="display: flex; justify-content: space-between;">
							<div style="display: flex; flex-direction: column;">
								<button @click="add_exercise()">+ exercise</button>
								<button x-show="!show_import" @click="show_import = true;">import exercises</button>
							</div>
							
							<div style="display: flex;">
								<div><button @click="cancel_edit_workout()">Cancel</button></div>
								
								<div style="display: flex; flex-direction: column;">
									<button @click="save_workout()" :disabled="temp_workout.name == '' || temp_workout.exercises.length == 0">Save</button>
									<template x-if="temp_workout.name == ''"><div>Enter workout name</div></template>
									<template x-if="temp_workout.exercises.length == 0"><div>Add at least one exercise</div></template>
								</div>
							</div>
						</div>
						<template x-if="show_import">
							<div>
								<textarea x-model="exercises_import_str" rows="10" style="width: 100%;" placeholder="paste your exercises here, separated by newline"></textarea><br />
								<button @click="import_exercises()">import exercises</button>
							</div>
						</template>
					</div>
				</template>
				<template x-if="panel == 'run'">
					<run_panel>
						<h2 x-text="get_curr_workout().name"></h2>
						<div style="flex-direction: column; align-items: center;" :style="{display: is_running() ? 'flex' : 'none'}">
							<template x-if="state =='running' && curr_exercise.period == 'work'">
								<h3 x-text="get_exercises()[curr_exercise.exercise].name"></h3>
							</template>
							<template x-if="state =='pre_delay' && curr_exercise.period == 'work'">
								<h3>Get ready</h3>
							</template>
							<template x-if="curr_exercise.period == 'rest'">
								<h3>Rest</h3>
							</template>
							<!-- outer ring: workout, inner ring: current exercise / rest; r = 15.9155 makes the circumference 100 -->
							<workout_timer>
								<svg viewBox="0 0 42 42">
									<circle class="ring_track" cx="21" cy="21" r="15.9155" stroke-width="3" />
									<circle class="ring_workout" cx="21" cy="21" r="15.9155" stroke-width="3" stroke-dasharray="100" transform="rotate(-90 21 21)"
										:style="{'stroke-dashoffset': `${100 - workout_progress() * 100}px`}" />
									<g transform="translate(21 21) scale(0.78) translate(-21 -21)">
										<circle class="ring_track" cx="21" cy="21" r="15.9155" stroke-width="3" />
										<!-- smooth only in normal mode: animates to the value of the next tick (see exercise_progress) -->
										<circle class="ring_exercise" cx="21" cy="21" r="15.9155" stroke-width="3" stroke-dasharray="100" transform="rotate(-90 21 21)"
											:style="{'stroke-dashoffset': `${100 - exercise_progress() * 100}px`, 'transition': exercise_ring_transition()}" />
									</g>
									<text x="21" y="21" text-anchor="middle" dominant-baseline="central" font-size="9" fill="currentColor"
										x-text="Math.max (0, Math.ceil (curr_exercise.remaining_time / 1000) )"></text>
								</svg>
							</workout_timer>
							<template x-if="get_curr_workout().exercises.length - 1 > curr_exercise.exercise">
								<div style="text-align: center; font-size: 3rem;">
									Next exercise: <span x-text="get_exercises()[curr_exercise.exercise + (state == 'pre_delay' ? 0 : 1)].name"></span>
									
								</div>
							</template>
							<template x-if="get_exercises().length - 1 <= curr_exercise.exercise">
								<div style="text-align: center; font-size: 3rem;">
									Last exercise
								</div>
							</template>
							<div>
								(<span x-html="curr_exercise.exercise + (curr_exercise.period == 'work' ? 1 : 2)"></span>/<span x-html="get_curr_workout().exercises.length"></span>)
							</div>
						</div>
						<template x-if="state == 'finished'">
							<h3>Finished</h3>
						</template>
						
						<div style="display: flex;">
							<div style="display: flex; flex-direction: column; align-items: center;">
								<button @click="start_workout()" x-show="!is_running()">Start</button>
								<template x-if="!is_running()">
									<label style="border: none; font-size: 2rem;">
										<input type="checkbox" x-model="shuffle" /> Shuffle exercises
									</label>
								</template>
							</div>
							<button @click="pause_workout()" x-show="is_running()" x-html="pause ? 'Continue' : 'Pause'"></button>
							<button @click="quit_workout()" x-show="is_running()">Quit</button>
						</div>
						
						<div style="display: flex;"  x-show="state == 'running'">
							<button @click="jump_to_exercise (-1)" :disabled="curr_exercise.exercise == 0">	&#9198;</button>
							<button @click="jump_to_exercise (0)">&#10227;</button>
							<button @click="jump_to_exercise (1)" :disabled="curr_exercise.exercise == get_exercises().length - 1">&#9197;</button>		
						</div>
					</run_panel>
				</template>
			</div>
		</template>
	</body>

</html>
